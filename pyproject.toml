[project]
name = "toutiao-backend"
version = "0.1.0"
description = "FastAPI backend for Toutiao-style news APIs"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.2.0",
    "bcrypt==4.0.1",
    "cryptography>=47.0.0",
    "fastapi>=0.115.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]
